<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#066f68" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#052e2b" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nexegin" />

    <title>Nexegin — Find your next IT role</title>
    <meta name="description" content="Find your next IT role. Explore IT jobs, save opportunities, and manage your applications in one place." />
    <link rel="canonical" href="https://nexegin.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nexegin — Find your next IT role" />
    <meta property="og:description" content="Explore IT jobs, save opportunities, and manage your applications in one place." />
    <meta property="og:image" content="https://nexegin.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nexegin: Find your next IT role" />
    <meta property="og:url" content="https://nexegin.com" />
    <meta property="og:site_name" content="Nexegin" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexegin — Find your next IT role" />
    <meta name="twitter:description" content="Explore IT jobs, save opportunities, and manage your applications in one place." />
    <meta name="twitter:image" content="https://nexegin.com/og-image.png" />

    <!-- Dark-mode FOUC prevention — runs before React mounts -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = saved === 'dark' || (!saved && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>

    <!-- Organization JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Nexegin",
      "url": "https://nexegin.com",
      "logo": "https://nexegin.com/favicon.svg",
      "description": "Nexegin is a job board for IT and technical roles. Find your next IT role — explore IT jobs, save opportunities, and manage your applications in one place.",
      "sameAs": [
        "https://www.linkedin.com/company/nexegin",
        "https://twitter.com/nexegin"
      ]
    }
    </script>

    <!-- WebSite + SearchAction for sitelinks search box -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Nexegin",
      "url": "https://nexegin.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://nexegin.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
